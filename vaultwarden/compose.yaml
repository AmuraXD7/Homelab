services:
  vaultwarden:
    image: vaultwarden/server:1.36.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      DOMAIN: "https://${TS_HOSTNAME}"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8081:80"
