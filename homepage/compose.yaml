services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${TS_HOSTNAME}:3010,127.0.0.1:3010,localhost:3010
      HOMEPAGE_VAR_TS_HOST: ${TS_HOSTNAME}
    volumes:
      - ./config:/app/config
