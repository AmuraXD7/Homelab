services:
  navidrome:
    image: deluan/navidrome:0.60.3
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "127.0.0.1:4533:4533"
    volumes:
      - ./data:/data
      - ./music:/music:ro
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: ""
    restart: unless-stopped
