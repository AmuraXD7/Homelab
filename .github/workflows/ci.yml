name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every compose file parses
        run: |
          set -euo pipefail
          for f in */compose.yaml; do
            d="$(dirname "$f")"
            echo "::group::$d"
            # Use the example env so required variables resolve.
            if [ -f "$d/.env.example" ]; then cp "$d/.env.example" "$d/.env"; fi
            docker compose -f "$f" --project-directory "$d" config -q
            echo "::endgroup::"
          done

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
